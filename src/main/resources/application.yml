server:
  servlet:
    context-path: /api/v1
spring:
  application:
    name: pedidos-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/liverpool_pedidos}
app:
  external-api:
    pedidos:
      url: ${EXTERNAL_API_PEDIDOS_URL:https://6994a4eab081bc23e9c0f61e.mockapi.io/api/v1/pedidos}
      timeout: ${EXTERNAL_API_TIMEOUT:5000}
    items:
      url: ${EXTERNAL_API_ITEMS_URL:https://6994a4eab081bc23e9c0f61e.mockapi.io/api/v1/items}
      timeout: ${EXTERNAL_API_TIMEOUT:5000}
resilience4j:
  circuitbreaker:
    instances:
      pedidosApi:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      pedidosApi:
        max-attempts: 3
        wait-duration: 2s
        ignore-exceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException.NotFound

