openapi: 3.0.3
info:
  title: pedidos-backend
  description: API de gestión de clientes y búsqueda de pedidos para la prueba técnica de El Puerto de Liverpool.
  version: 1.0.0
servers:
  - url: /api/v1

paths:
  /customers:
    post:
      summary: Crea un nuevo cliente
      description: Guarda un cliente en la base de datos.
      operationId: createCustomer
      tags:
        - Customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRequest"
      responses:
        "201":
          description: Cliente creado exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          description: Solicitud incorrecta (datos inválidos).

  /customers/{userId}:
    get:
      summary: Obtiene un cliente por su ID
      description: Recupera la información del cliente y recupera su lista de pedidos actualizada.
      operationId: getCustomerById
      tags:
        - Customers
      parameters:
        - name: userId
          in: path
          required: true
          description: ID del usuario / cliente.
          schema:
            type: string
      responses:
        "200":
          description: Cliente recuperado exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "404":
          description: Cliente no encontrado.

    put:
      summary: Actualiza un cliente existente
      description: Modifica los datos personales de un cliente en la base de datos.
      operationId: updateCustomer
      tags:
        - Customers
      parameters:
        - name: userId
          in: path
          required: true
          description: ID del usuario a actualizar.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRequest"
      responses:
        "200":
          description: Cliente actualizado exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "404":
          description: Cliente no encontrado.

    delete:
      summary: Elimina un cliente por su ID
      description: Remueve el cliente de la base de datos.
      operationId: deleteCustomer
      tags:
        - Customers
      parameters:
        - name: userId
          in: path
          required: true
          description: ID del usuario a eliminar.
          schema:
            type: string
      responses:
        "204":
          description: Cliente eliminado exitosamente (sin contenido).
        "404":
          description: Cliente no encontrado.

  /orders/search:
    get:
      summary: Búsqueda flexible de pedidos
      description: Realiza una búsqueda type-ahead flexible sobre pedidos filtrando por referencia, estatus o nombre de tienda. Recupera los productos resolviendo sus nombres amigables.
      operationId: searchOrders
      tags:
        - Orders
      parameters:
        - name: query
          in: query
          required: true
          description: Cadena de caracteres a buscar
          schema:
            type: string
      responses:
        "200":
          description: Búsqueda ejecutada de forma exitosa.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderSearchResponse"

components:
  schemas:
    CustomerRequest:
      type: object
      required:
        - userId
        - firstName
        - lastName
        - email
      properties:
        userId:
          type: string
          description: Identificador único del cliente.
        firstName:
          type: string
          description: Nombre del cliente.
        lastName:
          type: string
          description: Apellido paterno del cliente.
        secondLastName:
          type: string
          description: Apellido materno del cliente.
        email:
          type: string
          format: email
          description: Correo electrónico de contacto.
        shippingAddress:
          type: string
          description: Dirección física para envíos de mercancía.

    CustomerResponse:
      type: object
      required:
        - userId
        - firstName
        - lastName
        - email
      properties:
        userId:
          type: string
          description: Identificador único del cliente.
        firstName:
          type: string
          description: Nombre del cliente.
        lastName:
          type: string
          description: Apellido paterno.
        secondLastName:
          type: string
          description: Apellido materno.
        email:
          type: string
          format: email
          description: Correo electrónico de contacto.
        shippingAddress:
          type: string
          description: Dirección física para envíos de mercancía.
        orders:
          type: array
          items:
            $ref: "#/components/schemas/CustomerOrder"
          description: Lista de pedidos asociados al usuario de forma simplificada sin detalle de productos.

    CustomerOrder:
      type: object
      required:
        - orderRef
      properties:
        orderRef:
          type: string
          description: Referencia única de la orden de pedido.
        orderStatus:
          type: string
          description: Fecha estimada de entrega.
        storeName:
          type: string
          description: Nombre de la tienda asociada.
        canal:
          type: string
          description: Canal de venta (ej. physical, online).

    OrderSearchResponse:
      type: object
      required:
        - orderRef
      properties:
        orderRef:
          type: string
          description: Referencia única de la orden de pedido.
        orderStatus:
          type: string
          description: Estatus de entrega o procesamiento de la orden.
        storeName:
          type: string
          description: Nombre de la tienda de origen.
        canal:
          type: string
          description: Canal de venta utilizado.
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemResponse"
          description: Lista de productos asociados a la orden con sus nombres amigables resueltos.

    ItemResponse:
      type: object
      required:
        - itemId
        - quantity
        - displayName
      properties:
        itemId:
          type: string
          description: Identificador único del producto o artículo.
        quantity:
          type: integer
          description: Cantidad de piezas solicitadas de este artículo.
        displayName:
          type: string
          description: Nombre amigable y comercial del producto recuperado del catálogo.
